[package]
name = "chip-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "chipcutter"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["gpu-compute"]
gpu-compute = ["chip-sim/gpu-compute", "chip-project/gpu-compute"]

[dependencies]
chip-math.workspace = true
chip-fixtures.workspace = true
chip-cad.workspace = true
chip-sketch.workspace = true
chip-tools = { workspace = true, features = ["user-config", "fusion-import"] }
chip-machines.workspace = true
chip-cam.workspace = true
chip-sim.workspace = true
chip-post.workspace = true
chip-project.workspace = true
chip-demos.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
