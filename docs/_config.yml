title: ChipCutter
description: >-
  Open-source offline 2.5D, 3-Axis Surface, V-Carve, and 4th-Axis Rotary
  desktop CAM application and headless G-code verification CLI.
url: "https://rk29.github.io"
baseurl: "/ChipCutter"
repository: "rk29/ChipCutter"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true
  remove_originals: false
  with_frontmatter: false

optional_front_matter:
  remove_originals: false

titles_from_headings:
  enabled: true
  strip_title: false
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
