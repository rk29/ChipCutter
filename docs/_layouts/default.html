<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — Offline 2.5D, 3-Axis, &amp; 4th-Axis CAM{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" type="image/png" href="{{ '/images/chipcutter-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/images/chipcutter-icon.png' | relative_url }}" alt="ChipCutter logo" width="28" height="28">
        <span>ChipCutter</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/samples/' | relative_url }}">Sample Gallery</a>
        <a href="{{ '/tutorials/' | relative_url }}">Tutorials</a>
        <a href="https://github.com/rk29/ChipCutter/releases" target="_blank" rel="noopener">Downloads</a>
        <a class="nav-gh" href="https://github.com/rk29/ChipCutter" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="doc-container">
    <article class="markdown-body">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>
        <strong>ChipCutter</strong> — Open-source offline desktop CAM &amp; G-code verification suite.
        Licensed under <a href="https://github.com/rk29/ChipCutter/blob/main/LICENSE-MIT">MIT</a> or
        <a href="https://github.com/rk29/ChipCutter/blob/main/LICENSE-APACHE">Apache-2.0</a>.
      </p>
      <p class="footer-links">
        <a href="{{ '/samples/' | relative_url }}">Sample Gallery</a>
        <span>·</span>
        <a href="{{ '/tutorials/' | relative_url }}">Tutorials</a>
        <span>·</span>
        <a href="https://github.com/rk29/ChipCutter/releases">Releases</a>
        <span>·</span>
        <a href="https://github.com/rk29/ChipCutter">Source Code</a>
      </p>
    </div>
  </footer>
</body>
</html>
