name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-audit:
    name: Format, Clippy, & Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux GTK3 build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit licenses & advisories (cargo-deny default)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check

      - name: Audit licenses & advisories (cargo-deny flatpak-portal)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: --no-default-features --features chip-gui/flatpak-portal check

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux GTK3 build headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run core & CLI workspace tests
        run: cargo test --workspace --exclude chip-gui

      - name: Run chip-gui non-GPU unit tests
        run: |
          cargo test -p chip-gui --lib -- --skip renders_
          cargo test -p chip-gui --bin chip-gui

      - name: Smoke-test CLI outside repository directory
        shell: bash
        run: |
          cargo build -p chip-cli
          CLI_BIN="$(pwd)/target/debug/chipcutter"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            CLI_BIN="${CLI_BIN}.exe"
          fi
          TMP_WORK="$(mktemp -d)"
          (
            cd "$TMP_WORK"
            "$CLI_BIN" --version
            "$CLI_BIN" list-posts
          )
          rm -rf "$TMP_WORK"
