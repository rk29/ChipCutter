schema_version = 1
id = "carvera-air"
name = "Makera Carvera Air"
manufacturer = "Makera"
description = 'Desktop smart CNC with lever quick-change 1/8" spindle, auto-probe/leveling, optional harmonic-drive 4th-axis rotary module, and Makera 1/8" Essential Milling Bit Set (Extended).'
tool_change = "quick_change"
has_toolsetter = true
default_post_profile = "grblhal_atc"

[travel_mm]
