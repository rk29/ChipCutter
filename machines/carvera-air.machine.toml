schema_version = 1
id = "carvera-air"
name = "Makera Carvera Air"
manufacturer = "Makera"
description = 'Desktop smart CNC with lever quick-change 1/8" spindle, auto-probe/leveling, optional harmonic-drive 4th-axis rotary module, and Makera starter bit set.'
tool_change = "quick_change"
has_toolsetter = true
default_post_profile = "grblhal_atc"

[travel_mm]
x_mm = 300.0
y_mm = 200.0
z_mm = 130.0

[spindle]
min_rpm = 1000.0
max_rpm = 13000.0
power_watts = 200.0
collet_type = 'Quick-Change 1/8" (3.175mm) Collet'
supported_shank_diameters_mm = [3.175]

[kinematics]
max_rapid_xy_mm_min = 4000.0
max_rapid_z_mm_min = 2000.0
max_cut_feed_xy_mm_min = 2000.0
max_cut_feed_z_mm_min = 800.0
accel_mm_s2 = 500.0
junction_deviation_mm = 0.05
tool_change_time_sec = 12.0
max_rotary_rate_deg_min = 3600.0

[rotary]
axis = "A"
max_stock_diameter_mm = 92.0
max_stock_length_mm = 200.0
chuck_diameter_mm = 50.0
chuck_length_mm = 20.0
default_post_profile_4axis = "grblhal_4axis"

