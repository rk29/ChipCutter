schema_version = 1
id = "generic"
name = "Generic 3/4-Axis CNC Mill"
manufacturer = "ChipCutter"
description = "Baseline 3-axis and 4th-axis CNC mill with the standard metric/imperial starter tool library."
tool_change = "manual"
has_toolsetter = false
default_post_profile = "grbl"

[travel_mm]
x_mm = 400.0
y_mm = 300.0
z_mm = 150.0

[spindle]
min_rpm = 1000.0
max_rpm = 24000.0
power_watts = 1500.0
collet_type = "ER16 / ER20"
supported_shank_diameters_mm = [
    3.0,
    3.175,
    4.0,
    6.0,
    6.35,
    8.0,
    10.0,
    12.0,
]

[kinematics]
max_rapid_xy_mm_min = 5000.0
max_rapid_z_mm_min = 2500.0
max_cut_feed_xy_mm_min = 5000.0
max_cut_feed_z_mm_min = 2500.0
accel_mm_s2 = 500.0
junction_deviation_mm = 0.05
tool_change_time_sec = 15.0
max_rotary_rate_deg_min = 3600.0

[rotary]
