schema_version = 1
id = "milo-1.5"
name = "Millennium Machines Milo v1.5 (LDO Kit)"
manufacturer = "Millennium Machines / LDO Motors"
description = "Open-source 3-axis benchtop CNC mill (LDO Edition with FMJ, F.I.X.T.A.E.D plate, Long John toolsetter, 1.5 kW ER16 spindle, and LDO DLC starter endmills)."
