schema_version = 1
id = "carvera"
name = "Makera Carvera"
manufacturer = "Makera"
description = 'Desktop smart CNC with 6-tool automatic tool changer (ATC), fixed toolsetter, auto-probe/leveling, optional 4th-axis rotary module, and Makera 1/8" starter bit set.'
tool_change = "automatic_atc"
has_toolsetter = true
default_post_profile = "grblhal_atc"

[travel_mm]
x_mm = 360.0
y_mm = 240.0
z_mm = 140.0

[spindle]
min_rpm = 1000.0
max_rpm = 15000.0
power_watts = 200.0
collet_type = 'ATC 1/8" (3.175mm) Collet (opt. 3/4/6/6.35mm)'
supported_shank_diameters_mm = [
    3.0,
    3.175,
    4.0,
    6.0,
    6.35,
]

[kinematics]
max_rapid_xy_mm_min = 4500.0
max_rapid_z_mm_min = 2000.0
max_cut_feed_xy_mm_min = 2200.0
max_cut_feed_z_mm_min = 800.0
accel_mm_s2 = 500.0
junction_deviation_mm = 0.05
tool_change_time_sec = 8.0
max_rotary_rate_deg_min = 3600.0

[rotary]
axis = "A"
max_stock_diameter_mm = 92.0
max_stock_length_mm = 240.0
chuck_diameter_mm = 50.0
chuck_length_mm = 20.0
default_post_profile_4axis = "grblhal_4axis"

