schema_version = 1
id = "voron-cascade"
name = "Voron Cascade"
manufacturer = "Voron Design"
description = "Enclosed open-source desktop CNC mill with 340 x 225 mm tooling plate, MGN15 linear rails, NEMA 23 steppers, fixed toolsetter, and 1.5 kW ER16 spindle."
tool_change = "manual"
has_toolsetter = true
default_post_profile = "grblhal_atc"

[travel_mm]
x_mm = 275.0
y_mm = 220.0
z_mm = 90.0

[spindle]
min_rpm = 8000.0
max_rpm = 24000.0
power_watts = 1500.0
collet_type = "ER16 (3–8mm metric & imperial collets)"
supported_shank_diameters_mm = [
    3.0,
    3.175,
    4.0,
    5.0,
    6.0,
    6.35,
    8.0,
]

[kinematics]
max_rapid_xy_mm_min = 3500.0
max_rapid_z_mm_min = 1500.0
max_cut_feed_xy_mm_min = 2200.0
max_cut_feed_z_mm_min = 800.0
accel_mm_s2 = 600.0
junction_deviation_mm = 0.05
tool_change_time_sec = 20.0
max_rotary_rate_deg_min = 3600.0

