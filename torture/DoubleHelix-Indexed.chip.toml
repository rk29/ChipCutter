horizontal_sweep_deg = 90.0

[setups.operations.linking.lead_in.horizontal_radius]
expr = "tool_d * 0.25"
value_mm = 1.5

[setups.operations.linking.lead_in.linear_length]
expr = "tool_d * 0.15"
value_mm = 0.9

[setups.operations.linking.lead_in.vertical_radius]
value_mm = 0.0

[setups.operations.linking.lead_out]
enabled = true
horizontal_sweep_deg = 90.0

[setups.operations.linking.lead_out.horizontal_radius]
expr = "tool_d * 0.25"
value_mm = 1.5

[setups.operations.linking.lead_out.linear_length]
expr = "tool_d * 0.15"
value_mm = 0.9

[setups.operations.linking.lead_out.vertical_radius]
value_mm = 0.0

[setups.operations.linking.seam_overlap]
value_mm = 0.5

[setups.operations.strategy]
strategy_kind = "rotary_4axis_sim"
pattern = "simultaneous_spiral"
cut_direction = "zig_zag"
tilt_mode = "surface_normal_auto_tilt"
max_tilt_deg = 18.0
tilt_smoothing_window = 3
use_cusp_height = true
start_angle_deg = 0.0
end_angle_deg = 360.0
angular_sample_deg = 2.5

[setups.operations.strategy.lateral_offset]
value_mm = 2.5

[setups.operations.strategy.stepover]
value_mm = 1.2

[setups.operations.strategy.cusp_height]
value_mm = 0.02

[setups.operations.strategy.axial_margin_start]
value_mm = 0.0

[setups.operations.strategy.axial_margin_end]
value_mm = 0.0

[setups.operations.strategy.axial_sample_step]
value_mm = 0.5

[setups.operations.strategy.smoothing_tolerance]
value_mm = 0.005
