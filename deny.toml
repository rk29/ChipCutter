# ChipCutter cargo-deny configuration
# Enforces permissive / weak-copyleft licenses only (no GPL / LGPL / AGPL).

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]

# egui's bundled default fonts (Hack & Ubuntu Mono/Proportional) carry permissive font licenses.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["MIT", "Apache-2.0", "OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
