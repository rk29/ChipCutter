# ChipCutter Post-Processor Profile: GRBL 3-Axis Swapped-Axis Rotary Wrap (Y -> Rotary)
# Maps rotary angular motion (theta_rad * stock_radius_mm) onto the Y linear stepper channel for
# standard 3-axis GRBL controllers running a rotary chuck on the Y driver.

schema_version = 1
id = "grbl_rotary_wrap"
name = "GRBL 3-Axis Rotary Wrap (Y-Swapped)"
description = "Swaps rotary angular commands onto Y linear travel (mm = theta_rad * R_stock) for 3-axis GRBL controllers."
extension = "nc"

units = "mm"
coord_decimals = 3
feed_decimals = 0
spindle_decimals = 0
suppress_trailing_zeros = true
max_line_length = 80
comment_style = "parentheses"

emit_wcs_code = true
allow_extended_wcs = false
use_g43_length_offset = false
use_cutter_comp_g41_g42 = false
safe_home_z_on_end = false

arc_center_mode = "incremental_ijk"
max_arc_sweep_deg = 90.0
allow_helical_arcs = true
helical_linearize_tol_mm = 0.015

expand_drill_cycles = true
tool_change_mode = "split_files_by_tool"

rapid_rate_mm_min = 5000.0
accel_mm_s2 = 500.0
tool_change_time_sec = 0.0

program_header = [
    "G90 G94 G17 {unit_code}",
    "{wcs_code}",
]

operation_header = [
    "({op_name} - {strategy_name})",
]

tool_change_block = []

spindle_start_block = [
    "S{rpm} {spindle_dir}",
]

operation_footer = []

program_footer = [
    "M5",
    "M30",
]

[rotary]
enabled = true
axis_letter = "A"
angle_decimals = 3
supports_g93_inverse_time = false
use_g93_for_simultaneous = false
max_rotary_feed_deg_min = 3600.0
unwind_mode = "continuous_multi_turn"
swap_linear_axis = "replace_y"
