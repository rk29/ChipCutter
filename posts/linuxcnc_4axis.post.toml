# ChipCutter Post-Processor Profile: LinuxCNC 4-Axis (RS274NGC XYZA / G93 Inverse-Time)
# Supports configurable A/B/C rotary axis, G93 inverse-time feed on simultaneous 4-axis moves,
# automatic G94 restoration on linear/drill blocks, G64 path blending, and T# M6 + G43 H#.

schema_version = 1
id = "linuxcnc_4axis"
name = "LinuxCNC 4-Axis (XYZA / G93)"
description = "LinuxCNC RS274NGC 4-axis post with A/B/C rotary output, automatic G93 inverse-time feed, G64 blending, and G43 offsets."
extension = "ngc"

units = "mm"
coord_decimals = 4
feed_decimals = 1
spindle_decimals = 0
suppress_trailing_zeros = false
comment_style = "parentheses"
path_blend_tol_mm = 0.025

emit_wcs_code = true
allow_extended_wcs = true
use_g43_length_offset = true
use_cutter_comp_g41_g42 = true
safe_home_z_on_end = true

arc_center_mode = "incremental_ijk"
max_arc_sweep_deg = 180.0
allow_helical_arcs = true
helical_linearize_tol_mm = 0.010

expand_drill_cycles = false
tool_change_mode = "m6"

rapid_rate_mm_min = 6000.0
accel_mm_s2 = 800.0
tool_change_time_sec = 15.0

program_header = [
    "%",
    "G17 {unit_code} G40 G49 {wcs_code} G80 G90 G94 {blend_code}",
]

operation_header = [
    "( --- {op_name} [{strategy_name}] --- )",
]

tool_change_block = [
    "M9",
    "M5",
    "T{tool_number} M6",
    "G43 H{length_offset}",
]

spindle_start_block = [
    "S{rpm} {spindle_dir}",
]

operation_footer = [
    "G80",
]

program_footer = [
    "G94",
    "M9",
    "M5",
    "G53 G0 Z0",
    "M2",
    "%",
]

[rotary]
enabled = true
axis_letter = "A"
angle_decimals = 3
supports_g93_inverse_time = true
use_g93_for_simultaneous = true
max_rotary_feed_deg_min = 7200.0
unwind_mode = "continuous_multi_turn"
